apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../app
  - ingress.yaml
images:
  - name: linkpulse
    newName: YOUR_AWS_ACCOUNT_ID.dkr.ecr.YOUR_REGION.amazonaws.com/linkpulse
    newTag: manual-1
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ecr-pull
  - target:
      kind: Job
      name: migrate
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ecr-pull
  - target:
      kind: ConfigMap
      name: linkpulse-config
    patch: |-
      - op: replace
        path: /data/BASE_URL
        value: http://YOUR_EC2_IP
