apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: linkpulse
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: linkpulse:local
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: linkpulse-config
            - secretRef:
                name: linkpulse-secrets
